<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Benny's Mod v2 - Web Physics Sandbox</title>
    <style>
        * { box-sizing: border-box; font-family: 'Segoe UI', Roboto, sans-serif; }
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background: #000; user-select: none;
        }

        #canvas-container { width: 100%; height: 100%; position: absolute; top:0; left:0; }

        /* Crosshair */
        #crosshair {
            position: absolute; top: 50%; left: 50%;
            width: 8px; height: 8px; margin: -4px 0 0 -4px;
            border-radius: 50%; background: rgba(255, 255, 255, 0.9);
            border: 1px solid black; pointer-events: none; z-index: 10;
        }

        /* Lobby & Start Screen */
        #lobby-overlay {
            position: absolute; inset: 0;
            background: rgba(10, 10, 15, 0.95);
            display: flex; justify-content: center; align-items: center;
            z-index: 100;
        }

        .card {
            background: #1a1a24; border: 2px solid #007acc; border-radius: 12px;
            padding: 30px; width: 420px; color: white; text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .card h1 { margin-top: 0; color: #00aaff; }
        .form-group { margin: 15px 0; text-align: left; }
        .form-group label { display: block; font-size: 0.85rem; color: #aaa; margin-bottom: 5px; }
        .form-group input, .form-group select {
            width: 100%; padding: 10px; background: #0f0f15; border: 1px solid #333;
            color: white; border-radius: 6px; outline: none;
        }

        .btn {
            width: 100%; padding: 12px; margin-top: 10px; background: #007acc;
            color: white; border: none; border-radius: 6px; font-weight: bold;
            cursor: pointer; transition: background 0.2s;
        }
        .btn:hover { background: #0099ff; }

        /* In-Game HUD */
        #hud {
            position: absolute; top: 15px; right: 15px;
            display: flex; gap: 10px; z-index: 10; pointer-events: none;
        }
        .hud-badge {
            background: rgba(0, 0, 0, 0.7); color: #00ffcc; padding: 6px 14px;
            border-radius: 20px; font-size: 0.85rem; border: 1px solid #00ffcc;
        }

        /* Spawn Menu (Q Menu) */
        #spawn-menu {
            position: absolute; top: 20px; left: 20px; width: 380px;
            max-height: calc(100vh - 40px); background: rgba(18, 18, 24, 0.95);
            border: 2px solid #007acc; border-radius: 10px; display: none;
            flex-direction: column; padding: 18px; color: white; z-index: 50;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6); overflow-y: auto;
        }

        #spawn-menu h2 { margin: 0 0 10px 0; font-size: 1.2rem; color: #00aaff; border-bottom: 1px solid #333; padding-bottom: 5px; }
        #spawn-menu h3 { margin: 12px 0 6px 0; font-size: 0.9rem; color: #ddd; }

        .spawn-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
        .spawn-btn {
            background: #2a2a38; color: white; border: 1px solid #444; padding: 10px;
            border-radius: 6px; cursor: pointer; text-align: center; font-size: 0.85rem;
            transition: all 0.2s;
        }
        .spawn-btn:hover { background: #007acc; border-color: #00aaff; }

        .mod-submit { display: flex; flex-direction: column; gap: 6px; margin-top: 8px; }
        .mod-submit input { padding: 8px; background: #111; border: 1px solid #444; color: white; border-radius: 4px; font-size: 0.8rem; }
    </style>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
                "cannon-es": "https://unpkg.com/cannon-es@0.20.0/dist/cannon-es.js"
            }
        }
    </script>
</head>
<body>

    <div id="crosshair"></div>

    <div id="hud">
        <div id="room-badge" class="hud-badge">Room: Offline</div>
        <div id="player-badge" class="hud-badge">Players: 1</div>
    </div>

    <!-- Lobby Setup Modal -->
    <div id="lobby-overlay">
        <div class="card">
            <h1>Benny's Mod Sandbox</h1>
            <div class="form-group">
                <label>Game Mode / Privacy</label>
                <select id="room-type" onchange="toggleRoomInput()">
                    <option value="solo">Solo / Singleplayer</option>
                    <option value="public">Public Server (Lobby 1)</option>
                    <option value="private">Private Room (Enter Key)</option>
                </select>
            </div>
            <div class="form-group" id="private-key-group" style="display:none;">
                <label>Private Room Key</label>
                <input type="text" id="room-key" placeholder="e.g. benny123">
            </div>
            <button class="btn" onclick="joinGame()">Launch Sandbox</button>
        </div>
    </div>

    <!-- Persistent Q Spawn Menu -->
    <div id="spawn-menu">
        <h2>Spawn Menu</h2>
        
        <h3>Environment</h3>
        <div class="spawn-grid">
            <div class="spawn-btn" onclick="changeMap('flatgrass')">Flatgrass</div>
            <div class="spawn-btn" onclick="changeMap('construct')">gm_construct</div>
            <div class="spawn-btn" onclick="changeMap('warehouse')">Warehouse</div>
        </div>

        <h3>Basic Primitives</h3>
        <div class="spawn-grid">
            <div class="spawn-btn" onclick="spawnShape('cube')">Wooden Cube</div>
            <div class="spawn-btn" onclick="spawnShape('sphere')">Bouncing Ball</div>
            <div class="spawn-btn" onclick="spawnShape('cylinder')">Metal Barrel</div>
        </div>

        <h3>Saved Community Mods</h3>
        <div id="firebase-mods-list" class="spawn-grid">
            <!-- Dynamic Props Loaded from Firebase -->
        </div>

        <h3>Save New Mod (Firebase)</h3>
        <div class="mod-submit">
            <input type="text" id="mod-title" placeholder="Mod Title (e.g., Race Car)">
            <input type="text" id="mod-url" placeholder="Direct GLB URL">
            <button class="btn" style="padding: 8px; margin-top:0;" onclick="submitNewMod()">Save & Add Mod</button>
        </div>
    </div>

    <div id="canvas-container"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, onChildAdded, onDisconnect } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        import * as THREE from 'three';
        import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import * as CANNON from 'cannon-es';

        // --- Firebase Config ---
        const firebaseConfig = {
            apiKey: "AIzaSyBmHx2iZL0UFgr_d0y0-ENIQQ6EF82XuIs",
            authDomain: "bennysmod.firebaseapp.com",
            databaseURL: "https://bennysmod-default-rtdb.firebaseio.com",
            projectId: "bennysmod",
            storageBucket: "bennysmod.firebasestorage.app",
            messagingSenderId: "739121709314",
            appId: "1:739121709314:web:69323c2e9ebaab911c821b",
            measurementId: "G-TB8EBLGN6X"
        };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // --- Room & Player State ---
        let currentRoom = "solo";
        let isMultiplayer = false;
        const myPlayerId = 'player_' + Math.floor(Math.random() * 100000);
        const remotePlayers = {};

        // --- Three & Cannon Engine Globals ---
        let scene, camera, renderer, world, controls;
        let playerBody;
        let moveForward = false, moveBackward = false, moveLeft = false, moveRight = false, canJump = false;
        let prevTime = performance.now();

        const physicsObjects = {};
        const gltfLoader = new GLTFLoader();
        let mapGroup = new THREE.Group();

        // Physgun Controls
        let isHolding = false;
        let heldObjId = null;
        let grabDistance = 6;
        const mouseRaycaster = new THREE.Raycaster();

        // --- LOBBY ROOM CONTROLLER ---
        window.toggleRoomInput = function() {
            const mode = document.getElementById('room-type').value;
            document.getElementById('private-key-group').style.display = (mode === 'private') ? 'block' : 'none';
        };

        window.joinGame = function() {
            const mode = document.getElementById('room-type').value;
            if (mode === 'solo') {
                currentRoom = 'offline';
                isMultiplayer = false;
            } else if (mode === 'public') {
                currentRoom = 'public_lobby_1';
                isMultiplayer = true;
            } else if (mode === 'private') {
                const key = document.getElementById('room-key').value.trim();
                if (!key) return alert('Enter a room key!');
                currentRoom = 'room_' + key.toLowerCase();
                isMultiplayer = true;
            }

            document.getElementById('lobby-overlay').style.display = 'none';
            document.getElementById('room-badge').innerText = `Room: ${currentRoom.toUpperCase()}`;

            initEngine();
            setupSavedModsListener();

            if (isMultiplayer) {
                setupMultiplayerNetwork();
            }
        };

        // --- INITIALIZE GAME ---
        function initEngine() {
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x7ec0ee);
            scene.fog = new THREE.FogExp2(0x7ec0ee, 0.015);

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.getElementById('canvas-container').appendChild(renderer.domElement);

            world = new CANNON.World({ gravity: new CANNON.Vec3(0, -18, 0) });

            const ambient = new THREE.AmbientLight(0xffffff, 0.7);
            scene.add(ambient);

            const sun = new THREE.DirectionalLight(0xffffff, 1.2);
            sun.position.set(30, 60, 30);
            sun.castShadow = true;
            scene.add(sun);

            scene.add(mapGroup);
            buildMap('flatgrass');

            // Player Capsule Setup
            const playerShape = new CANNON.Sphere(0.8);
            playerBody = new CANNON.Body({ mass: 70, shape: playerShape, fixedRotation: true });
            playerBody.position.set(0, 5, 0);
            world.addBody(playerBody);

            controls = new PointerLockControls(camera, document.body);
            scene.add(controls.getObject());

            // Click-to-focus fix
            window.addEventListener('click', () => {
                const menu = document.getElementById('spawn-menu');
                if (menu.style.display !== 'flex' && !controls.isLocked) {
                    controls.lock();
                }
            });

            setupInputs();
            window.addEventListener('resize', onWindowResize);

            // Lock Pointer immediately on startup
            controls.lock();

            animate();
        }

        // --- MAP BUILDER ---
        window.changeMap = function(mapType) {
            while(mapGroup.children.length > 0) { mapGroup.remove(mapGroup.children[0]); }
            buildMap(mapType);
        };

        function buildMap(type) {
            const groundBody = new CANNON.Body({ type: CANNON.Body.STATIC, shape: new CANNON.Plane() });
            groundBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
            world.addBody(groundBody);

            const groundGeo = new THREE.PlaneGeometry(200, 200);
            const groundMat = new THREE.MeshStandardMaterial({ color: 0x333333 });
            const groundMesh = new THREE.Mesh(groundGeo, groundMat);
            groundMesh.rotation.x = -Math.PI / 2;
            groundMesh.receiveShadow = true;
            mapGroup.add(groundMesh);

            const grid = new THREE.GridHelper(200, 80, 0x007acc, 0x222222);
            grid.position.y = 0.01;
            mapGroup.add(grid);

            if (type === 'construct') {
                createStaticBlock(15, 10, 20, -10, 5, -25, 0x555555);
                createStaticBlock(20, 25, 20, 25, 12.5, -30, 0x333333);
            } else if (type === 'warehouse') {
                createStaticBlock(200, 20, 2, 0, 10, -100, 0x222222);
                createStaticBlock(200, 20, 2, 0, 10, 100, 0x222222);
            }
        }

        function createStaticBlock(sx, sy, sz, x, y, z, color) {
            const mesh = new THREE.Mesh(new THREE.BoxGeometry(sx, sy, sz), new THREE.MeshStandardMaterial({ color: color }));
            mesh.position.set(x, y, z);
            mesh.castShadow = true;
            mesh.receiveShadow = true;
            mapGroup.add(mesh);

            const body = new CANNON.Body({ type: CANNON.Body.STATIC, shape: new CANNON.Box(new CANNON.Vec3(sx / 2, sy / 2, sz / 2)) });
            body.position.set(x, y, z);
            world.addBody(body);
        }

        // --- INPUT & POINTER LOCK CONTROL FIX ---
        function setupInputs() {
            window.addEventListener('keydown', (e) => {
                if (e.code === 'KeyW') moveForward = true;
                if (e.code === 'KeyS') moveBackward = true;
                if (e.code === 'KeyA') moveLeft = true;
                if (e.code === 'KeyD') moveRight = true;
                if (e.code === 'Space' && canJump) {
                    playerBody.velocity.y = 10;
                    canJump = false;
                }
                if (e.code === 'KeyQ') {
                    // Properly toggle menu AND release pointer smoothly
                    const menu = document.getElementById('spawn-menu');
                    if (menu.style.display === 'flex') {
                        menu.style.display = 'none';
                        controls.lock();
                    } else {
                        menu.style.display = 'flex';
                        controls.unlock();
                    }
                }
            });

            window.addEventListener('keyup', (e) => {
                if (e.code === 'KeyW') moveForward = false;
                if (e.code === 'KeyS') moveBackward = false;
                if (e.code === 'KeyA') moveLeft = false;
                if (e.code === 'KeyD') moveRight = false;
            });

            window.addEventListener('mousedown', (e) => {
                if (e.button === 0 && controls.isLocked) grabObject();
            });
            window.addEventListener('mouseup', () => releaseObject());
            window.addEventListener('wheel', (e) => {
                if (isHolding) {
                    grabDistance -= e.deltaY * 0.01;
                    grabDistance = Math.max(2, Math.min(grabDistance, 30));
                }
            });
        }

        // --- PHYSGUN MECHANICS ---
        function grabObject() {
            mouseRaycaster.setFromCamera(new THREE.Vector2(0, 0), camera);
            const meshes = Object.values(physicsObjects).map(o => o.mesh);
            const intersects = mouseRaycaster.intersectObjects(meshes, true);

            if (intersects.length > 0) {
                let hitMesh = intersects[0].object;
                while (hitMesh.parent && !hitMesh.userData.id) hitMesh = hitMesh.parent;

                const id = hitMesh.userData.id;
                if (id && physicsObjects[id]) {
                    isHolding = true;
                    heldObjId = id;
                    physicsObjects[id].body.wakeUp();
                }
            }
        }

        function releaseObject() {
            isHolding = false;
            heldObjId = null;
        }

        function updatePhysgun() {
            if (isHolding && heldObjId && physicsObjects[heldObjId]) {
                const body = physicsObjects[heldObjId].body;
                const targetPos = new THREE.Vector3();
                camera.getWorldDirection(targetPos);
                targetPos.multiplyScalar(grabDistance).add(camera.position);

                body.velocity.set(
                    (targetPos.x - body.position.x) * 14,
                    (targetPos.y - body.position.y) * 14,
                    (targetPos.z - body.position.z) * 14
                );
            }
        }

        // --- FIREBASE MOD SYSTEM ---
        function setupSavedModsListener() {
            onValue(ref(db, 'saved_mods'), (snapshot) => {
                const mods = snapshot.val() || {};
                const list = document.getElementById('firebase-mods-list');
                list.innerHTML = '';

                for (let key in mods) {
                    const mod = mods[key];
                    const btn = document.createElement('div');
                    btn.className = 'spawn-btn';
                    btn.innerText = mod.title || 'Custom Mod';
                    btn.onclick = () => spawnModelFromUrl(mod.url);
                    list.appendChild(btn);
                }
            });
        }

        window.submitNewMod = function() {
            const title = document.getElementById('mod-title').value.trim();
            const url = document.getElementById('mod-url').value.trim();

            if (!title || !url) return alert('Enter both Title and GLB URL!');

            push(ref(db, 'saved_mods'), {
                title: title,
                url: url
            });

            document.getElementById('mod-title').value = '';
            document.getElementById('mod-url').value = '';
            alert('Mod Saved to Firebase!');
        };

        // --- PROP SPAWNING ---
        window.spawnShape = function(type) {
            const id = 'prop_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
            const pos = getSpawnPos();

            if (isMultiplayer) {
                set(ref(db, `rooms/${currentRoom}/props/${id}`), { type: 'primitive', shape: type, x: pos.x, y: pos.y, z: pos.z });
            } else {
                createLocalPrimitive(id, type, pos.x, pos.y, pos.z);
            }
        };

        function spawnModelFromUrl(url) {
            const id = 'prop_' + Date.now() + '_' + Math.random().toString(36).substr(2, 4);
            const pos = getSpawnPos();

            if (isMultiplayer) {
                set(ref(db, `rooms/${currentRoom}/props/${id}`), { type: 'model', url: url, x: pos.x, y: pos.y, z: pos.z });
            } else {
                createLocalModel(id, url, pos.x, pos.y, pos.z);
            }
        }

        function getSpawnPos() {
            const pos = new THREE.Vector3();
            camera.getWorldDirection(pos);
            return pos.multiplyScalar(5).add(camera.position);
        }

        // --- MULTIPLAYER ROOM ENGINE ---
        function setupMultiplayerNetwork() {
            const playerRef = ref(db, `rooms/${currentRoom}/players/${myPlayerId}`);
            onDisconnect(playerRef).remove();

            onValue(ref(db, `rooms/${currentRoom}/players`), (snapshot) => {
                const players = snapshot.val() || {};
                document.getElementById('player-badge').innerText = `Players: ${Object.keys(players).length}`;

                for (let id in players) {
                    if (id !== myPlayerId) {
                        if (!remotePlayers[id]) {
                            const pMesh = new THREE.Mesh(
                                new THREE.CapsuleGeometry(0.5, 1, 4, 8),
                                new THREE.MeshStandardMaterial({ color: 0xff0055 })
                            );
                            scene.add(pMesh);
                            remotePlayers[id] = pMesh;
                        }
                        remotePlayers[id].position.set(players[id].x, players[id].y, players[id].z);
                    }
                }

                for (let id in remotePlayers) {
                    if (!players[id]) {
                        scene.remove(remotePlayers[id]);
                        delete remotePlayers[id];
                    }
                }
            });

            onChildAdded(ref(db, `rooms/${currentRoom}/props`), (snapshot) => {
                const data = snapshot.val();
                const id = snapshot.key;
                if (!physicsObjects[id]) {
                    if (data.type === 'primitive') createLocalPrimitive(id, data.shape, data.x, data.y, data.z);
                    if (data.type === 'model') createLocalModel(id, data.url, data.x, data.y, data.z);
                }
            });
        }

        function createLocalPrimitive(id, shapeType, x, y, z) {
            let mesh, body;
            if (shapeType === 'cube') {
                mesh = new THREE.Mesh(new THREE.BoxGeometry(1.5, 1.5, 1.5), new THREE.MeshStandardMaterial({ color: 0xd2b48c }));
                body = new CANNON.Body({ mass: 10, shape: new CANNON.Box(new CANNON.Vec3(0.75, 0.75, 0.75)) });
            } else if (shapeType === 'sphere') {
                mesh = new THREE.Mesh(new THREE.SphereGeometry(1, 16, 16), new THREE.MeshStandardMaterial({ color: 0xff3333 }));
                body = new CANNON.Body({ mass: 5, shape: new CANNON.Sphere(1) });
            } else if (shapeType === 'cylinder') {
                mesh = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 2, 16), new THREE.MeshStandardMaterial({ color: 0x4488ff }));
                body = new CANNON.Body({ mass: 12, shape: new CANNON.Cylinder(0.8, 0.8, 2, 16) });
            }

            mesh.castShadow = true;
            mesh.userData.id = id;
            mesh.position.set(x, y, z);
            body.position.set(x, y, z);

            scene.add(mesh);
            world.addBody(body);
            physicsObjects[id] = { mesh, body };
        }

        function createLocalModel(id, url, x, y, z) {
            gltfLoader.load(url, (gltf) => {
                const model = gltf.scene;
                model.position.set(x, y, z);
                model.userData.id = id;
                model.traverse(c => { if(c.isMesh) c.castShadow = true; });

                const box = new THREE.Box3().setFromObject(model);
                const size = new THREE.Vector3();
                box.getSize(size);

                const body = new CANNON.Body({
                    mass: 10,
                    shape: new CANNON.Box(new CANNON.Vec3(Math.max(size.x/2, 0.3), Math.max(size.y/2, 0.3), Math.max(size.z/2, 0.3)))
                });
                body.position.set(x, y, z);

                scene.add(model);
                world.addBody(body);
                physicsObjects[id] = { mesh: model, body };
            });
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        // --- ANIMATION ENGINE LOOP ---
        function animate() {
            requestAnimationFrame(animate);

            const time = performance.now();
            const delta = Math.min((time - prevTime) / 1000, 0.1);
            prevTime = time;

            world.step(1 / 60, delta, 3);

            if (controls.isLocked) {
                const speed = 25.0;
                const inputVector = new THREE.Vector3();

                if (moveForward) inputVector.z -= 1;
                if (moveBackward) inputVector.z += 1;
                if (moveLeft) inputVector.x -= 1;
                if (moveRight) inputVector.x += 1;
                inputVector.normalize();

                const yawEuler = new THREE.Euler(0, camera.rotation.y, 0, 'YXZ');
                inputVector.applyEuler(yawEuler);

                playerBody.velocity.x = inputVector.x * speed;
                playerBody.velocity.z = inputVector.z * speed;

                if (Math.abs(playerBody.velocity.y) < 0.05) canJump = true;

                camera.position.copy(playerBody.position);
                camera.position.y += 0.8;

                if (isMultiplayer) {
                    set(ref(db, `rooms/${currentRoom}/players/${myPlayerId}`), {
                        x: playerBody.position.x,
                        y: playerBody.position.y,
                        z: playerBody.position.z
                    });
                }
            }

            updatePhysgun();

            for (let id in physicsObjects) {
                const { mesh, body } = physicsObjects[id];
                mesh.position.copy(body.position);
                mesh.quaternion.copy(body.quaternion);
            }

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
